[package]
name = "opentelemetry-datalake"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[package.metadata.wix]
upgrade-guid = "2114856D-4676-4C5F-9E8D-4FFC419C8961"
path-guid = "E7FF3F65-3358-4192-8399-B0A919F15306"
license = false
eula = false

[workspace]
resolver = "2"
members = [
    "crates/*",
    # "examples/transforms/*", # Registered when examples/transforms/pii_scrubber is created in PR 8
]

[workspace.package]
description = "An OpenTelemetry datalake receiver streaming to Apache Iceberg"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/jimmystewpot/opentelemetry-datalake"
homepage = "https://github.com/jimmystewpot/opentelemetry-datalake"
authors = ["James Lamb"]

[dependencies]
pipeline-core = { workspace = true }
otlp-receiver = { workspace = true }
noop-transformer = { workspace = true }
wasm-transformer = { workspace = true }
kafka-sink = { workspace = true }
storage = { workspace = true, features = ["aws"] }
starrocks-sink = { workspace = true }
elasticsearch-sink = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[features]
default = []
aws = ["elasticsearch-sink/aws"]

[dev-dependencies]
arrow = { workspace = true }
wat = "1.220"
sha2 = { workspace = true }
hex = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[workspace.dependencies]
# Internal Workspace Crates
pipeline-core = { path = "crates/core", version = "0.1.0" }
arrow-codec = { path = "crates/arrow-codec", version = "0.1.0" }
otlp-receiver = { path = "crates/otlp-receiver", version = "0.1.0" }
noop-transformer = { path = "crates/noop-transformer", version = "0.1.0" }
wasm-transformer = { path = "crates/wasm-transformer", version = "0.1.0" }
kafka-sink = { path = "crates/kafka-sink", version = "0.1.0" }
storage = { path = "crates/storage", version = "0.1.0", default-features = false }
starrocks-sink = { path = "crates/starrocks-sink", version = "0.1.0" }
elasticsearch-sink = { path = "crates/elasticsearch-sink", version = "0.1.0" }

# Async Runtime
tokio = { version = "1.37", default-features = false, features = ["full"] }

# Errors
thiserror = "2.0.20"
anyhow = { version = "1.0", default-features = false, features = ["std"] }

# Telemetry
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt", "ansi", "std", "registry"] }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "metrics", "logs", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.32.0"
async-trait = "0.1"

# Serialization & Config
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.24.1", default-features = false, features = ["v7", "std"] }
figment = { version = "0.10", default-features = false, features = ["env", "toml"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }

# Arrow
arrow = { version = "59", default-features = false, features = ["json", "ipc"] }
parquet = { version = "59", default-features = false, features = ["async", "arrow", "zstd", "snap", "flate2", "lz4"] }

# WebAssembly Runtime (Wasmtime 48 — current stable, Rust 1.98+ required)
wasmtime = { version = "48", default-features = false, features = ["cranelift", "pooling-allocator"] }
wasmtime-wasi = { version = "48", default-features = false }

# Concurrent Collections
dashmap = { version = "6.0", default-features = false }

# Cryptography (SHA-256 module integrity)
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Codec & OTLP Parsing
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "gen-tonic", "tonic", "logs", "metrics", "trace", "with-serde"] }

# Networking
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }

# Sinks
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "tokio"] }
starrocks-stream-load = { version = "1.0.13", default-features = false }
bytes = "1.6"

# Testing & Benchmarking
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }

# Storage & Iceberg Catalogs
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde", "std"] }
iceberg = { default-features = false, git = "https://github.com/apache/iceberg-rust.git", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }
iceberg-catalog-rest = { default-features = false, git = "https://github.com/apache/iceberg-rust.git", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }
iceberg-catalog-glue = { default-features = false, git = "https://github.com/apache/iceberg-rust.git", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }  
iceberg-catalog-s3tables = { default-features = false, git = "https://github.com/apache/iceberg-rust.git", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }
iceberg-storage-opendal = { default-features = false, features = ["opendal-s3"], git = "https://github.com/apache/iceberg-rust.git", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }

[profile.release]
lto = "thin"
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"


