[package]
name = "starrocks-sink"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[features]
# rustls is the default TLS backend; it requires no system dependencies.
default = ["tls-rustls"]
# Forward to the SDK's `rustls` feature.
tls-rustls = ["starrocks-stream-load/rustls"]
# Forward to the SDK's `native-tls` feature. Enable this (with default-features = false)
# when your organisation mandates platform/system TLS. Mutually exclusive with tls-rustls.
tls-native-tls = ["starrocks-stream-load/native-tls"]

[dependencies]
pipeline-core = { workspace = true }
arrow = { workspace = true, features = ["ipc", "json", "csv"] }
starrocks-stream-load = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
