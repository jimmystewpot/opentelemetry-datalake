[package]
name = "elasticsearch-sink"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[features]
default = ["tls-native-roots", "tls-webpki-roots"]
aws = ["dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-config", "dep:aws-types"]
tls-native-roots = ["reqwest/rustls-tls-native-roots"]
tls-webpki-roots = ["reqwest/rustls-tls-webpki-roots"]

[dependencies]
pipeline-core = { workspace = true }
arrow = { workspace = true, features = ["json"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["http2", "gzip", "json"] }
chrono = { workspace = true }
itoa = "1"
ryu = "1"
flate2 = "1"
httpdate = "1.0"

# Optional AWS SigV4 signing
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
aws-types = { version = "1", optional = true }

[dev-dependencies]
toml = { workspace = true }
wiremock = "0.6"
tracing-subscriber = { workspace = true }
